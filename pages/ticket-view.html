<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>مشاهده تیکت | آدینه سهند سازه</title>

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

</head>


<body class="profile-body">


<div class="profile-page">

    <div class="profile-card ticket-view-page">


        <!-- ===============================
             TICKET DETAILS
        ================================ -->

        <div id="ticketDetails">

            <div class="ticket-loading">
                در حال بارگذاری تیکت...
            </div>

        </div>


        <!-- ===============================
             MESSAGES
        ================================ -->

        <div
            id="ticketMessages"
            class="ticket-messages"
        ></div>


        <!-- ===============================
             REPLY
        ================================ -->

        <form
            id="replyTicketForm"
            class="ticket-reply-form"
            style="display:none;"
        >

            <div class="auth-group">

                <label for="replyMessage">
                    پاسخ به تیکت
                </label>

                <textarea
                    id="replyMessage"
                    rows="5"
                    maxlength="2000"
                    placeholder="پاسخ خود را بنویسید..."
                    required
                ></textarea>

            </div>


            <button
                type="submit"
                class="profile-btn"
            >
                📤 ارسال پاسخ
            </button>

        </form>


        <!-- ===============================
             NAVIGATION
        ================================ -->

        <div
            class="ticket-navigation"
            style="
                display:flex;
                flex-direction:column;
                gap:12px;
                margin-top:20px;
            "
        >

            <a
                href="tickets.html"
                class="profile-btn"
            >
                🎫 بازگشت به تیکت‌ها
            </a>


            <a
                href="dashboard.html"
                class="profile-btn"
            >
                ⬅️ بازگشت به داشبورد
            </a>

        </div>


    </div>

</div>


<script>

(function () {

    "use strict";


    /* =====================================================
       USER
    ===================================================== */

    let user = null;

    try {

        user =
            JSON.parse(
                localStorage.getItem("user")
            );

    } catch (error) {

        user = null;

    }


    if (!user) {

        window.location.href =
            "login.html";

        return;

    }


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const details =
        document.getElementById(
            "ticketDetails"
        );


    const messagesContainer =
        document.getElementById(
            "ticketMessages"
        );


    const replyForm =
        document.getElementById(
            "replyTicketForm"
        );


    /* =====================================================
       GET ID FROM URL
    ===================================================== */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const urlId =
        String(
            params.get("id") || ""
        ).trim();


    console.log(
        "Ticket ID from URL:",
        urlId
    );


    /* =====================================================
       READ TICKETS
    ===================================================== */

    let tickets = [];

    try {

        const raw =
            localStorage.getItem("tickets");

        if (raw) {

            const parsed =
                JSON.parse(raw);

            if (Array.isArray(parsed)) {

                tickets = parsed;

            }

        }

    } catch (error) {

        console.error(
            "Tickets read error:",
            error
        );

        tickets = [];

    }


    console.log(
        "All tickets:",
        tickets
    );


    /* =====================================================
       NORMALIZE
    ===================================================== */

    function normalize(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }

        return String(value)
            .trim();

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHTML(value) {

        return String(
            value === null ||
            value === undefined
                ? ""
                : value
        )
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =====================================================
       DATE
    ===================================================== */

    function formatDate(value) {

        if (!value) {

            return "-";

        }


        const date =
            new Date(value);


        if (
            isNaN(
                date.getTime()
            )
        ) {

            return "-";

        }


        return date.toLocaleDateString(
            "fa-IR",
            {
                year: "numeric",
                month: "long",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }


    /* =====================================================
       STATUS
    ===================================================== */

    function statusText(status) {

        switch (
            String(status || "").toLowerCase()
        ) {

            case "pending":
                return "در حال بررسی";

            case "closed":
                return "بسته";

            case "open":
            default:
                return "باز";

        }

    }


    function statusClass(status) {

        switch (
            String(status || "").toLowerCase()
        ) {

            case "pending":
                return "ticket-status-pending";

            case "closed":
                return "ticket-status-closed";

            case "open":
            default:
                return "ticket-status-open";

        }

    }


    /* =====================================================
       FIND TICKET
       پشتیبانی از ساختارهای قدیمی و جدید
    ===================================================== */

    const ticket =
        tickets.find(function (item) {

            if (!item) {
                return false;
            }


            const possibleIds = [

                item.id,

                item.ticketId,

                item._id,

                item.number

            ];


            return possibleIds.some(
                function (value) {

                    return (
                        normalize(value) ===
                        urlId
                    );

                }
            );

        });


    console.log(
        "Found ticket:",
        ticket
    );


    /* =====================================================
       TICKET NOT FOUND
    ===================================================== */

    if (!ticket) {

        details.innerHTML = `

            <div
                class="ticket-not-found"
                style="
                    text-align:center;
                    padding:30px 10px;
                "
            >

                <div
                    style="
                        font-size:55px;
                        margin-bottom:15px;
                    "
                >
                    ⚠️
                </div>


                <h2>
                    تیکت پیدا نشد
                </h2>


                <p
                    style="
                        color:#94a3b8;
                        margin:15px 0 25px;
                    "
                >
                    تیکتی با این شماره پیدا نشد.
                </p>


                <p
                    style="
                        color:#64748b;
                        font-size:13px;
                        margin-bottom:20px;
                    "
                >
                    شماره تیکت:
                    ${escapeHTML(urlId || "-")}
                </p>


                <a
                    href="tickets.html"
                    class="profile-btn"
                >
                    🎫 بازگشت به تیکت‌ها
                </a>

            </div>

        `;


        messagesContainer.innerHTML = "";

        replyForm.style.display = "none";

        return;

    }


    /* =====================================================
       OWNER CHECK
    ===================================================== */

    function isOwner(ticket) {

        const currentUsername =
            normalize(
                user.username
            ).toLowerCase();


        const currentPhone =
            normalize(
                user.phone
            );


        const ticketUsername =
            normalize(
                ticket.username
            ).toLowerCase();


        const ticketPhone =
            normalize(
                ticket.phone
            );


        const ticketUserId =
            normalize(
                ticket.userId
            );


        const currentUserId =
            normalize(
                user.id
            );


        /* username */

        if (
            currentUsername &&
            ticketUsername &&
            currentUsername === ticketUsername
        ) {

            return true;

        }


        /* phone */

        if (
            currentPhone &&
            ticketPhone &&
            currentPhone === ticketPhone
        ) {

            return true;

        }


        /* userId */

        if (
            currentUserId &&
            ticketUserId &&
            currentUserId === ticketUserId
        ) {

            return true;

        }


        return false;

    }


    /* =====================================================
       ACCESS
    ===================================================== */

    if (!isOwner(ticket)) {

        details.innerHTML = `

            <div
                style="
                    text-align:center;
                    padding:30px 10px;
                "
            >

                <div
                    style="
                        font-size:55px;
                        margin-bottom:15px;
                    "
                >
                    🔒
                </div>


                <h2>
                    دسترسی غیرمجاز
                </h2>


                <p
                    style="
                        color:#94a3b8;
                        margin:15px 0 25px;
                    "
                >
                    این تیکت متعلق به حساب کاربری شما نیست.
                </p>


                <a
                    href="tickets.html"
                    class="profile-btn"
                >
                    🎫 بازگشت به تیکت‌ها
                </a>

            </div>

        `;


        messagesContainer.innerHTML = "";

        replyForm.style.display = "none";

        return;

    }


    /* =====================================================
       TICKET HEADER
    ===================================================== */

    const ticketId =
        ticket.id ||
        ticket.ticketId ||
        ticket._id ||
        ticket.number;


    details.innerHTML = `

        <div class="ticket-view-header">

            <div>

                <span class="ticket-number">

                    تیکت #

                    ${escapeHTML(ticketId)}

                </span>


                <h1>

                    ${escapeHTML(
                        ticket.title ||
                        "بدون عنوان"
                    )}

                </h1>

            </div>


            <span
                class="
                    ticket-status
                    ${statusClass(ticket.status)}
                "
            >

                ${statusText(ticket.status)}

            </span>

        </div>


        <div class="ticket-view-info">

            <div>

                <span>
                    دسته‌بندی
                </span>


                <strong>

                    📁

                    ${escapeHTML(
                        ticket.category ||
                        "سایر"
                    )}

                </strong>

            </div>


            <div>

                <span>
                    ایجاد شده
                </span>


                <strong>

                    🕒

                    ${formatDate(
                        ticket.createdAt
                    )}

                </strong>

            </div>

        </div>

    `;


    /* =====================================================
       MESSAGES
    ===================================================== */

    let messages = [];


    if (
        Array.isArray(
            ticket.messages
        )
    ) {

        messages =
            ticket.messages;

    }


    /*
       پشتیبانی از سیستم قدیمی replies
    */

    else if (
        Array.isArray(
            ticket.replies
        )
    ) {

        messages =
            ticket.replies.map(
                function (reply) {

                    return {

                        sender:
                            reply.sender === "user"
                                ? "user"
                                : "support",

                        message:
                            reply.message || "",

                        createdAt:
                            reply.createdAt

                    };

                }
            );

    }


    /* =====================================================
       RENDER MESSAGES
    ===================================================== */

    if (messages.length === 0) {

        messagesContainer.innerHTML = `

            <div
                class="ticket-no-messages"
                style="
                    padding:20px;
                    text-align:center;
                    color:#94a3b8;
                "
            >

                هنوز پیامی در این تیکت وجود ندارد.

            </div>

        `;

    }

    else {

        messagesContainer.innerHTML =

            messages
                .map(
                    function (message) {

                        const sender =
                            String(
                                message.sender ||
                                ""
                            ).toLowerCase();


                        const isUser =
                            sender === "user";


                        return `

                            <div
                                class="
                                    ticket-message
                                    ${
                                        isUser
                                            ? "ticket-message-user"
                                            : "ticket-message-support"
                                    }
                                "
                            >

                                <div
                                    class="ticket-message-head"
                                >

                                    <strong>

                                        ${
                                            isUser
                                                ? "👤 شما"
                                                : "🎧 پشتیبانی"
                                        }

                                    </strong>


                                    <span>

                                        ${formatDate(
                                            message.createdAt
                                        )}

                                    </span>

                                </div>


                                <div
                                    class="ticket-message-body"
                                >

                                    ${escapeHTML(
                                        message.message || ""
                                    ).replace(
                                        /\n/g,
                                        "<br>"
                                    )}

                                </div>

                            </div>

                        `;

                    }
                )
                .join("");

    }


    /* =====================================================
       REPLY FORM
    ===================================================== */

    if (
        String(
            ticket.status || "open"
        ).toLowerCase() === "closed"
    ) {

        replyForm.innerHTML = `

            <div
                class="ticket-closed-message"
                style="
                    padding:15px;
                    border-radius:12px;
                    background:#1e293b;
                    color:#cbd5e1;
                    text-align:center;
                "
            >

                🔒 این تیکت بسته شده است و
                امکان ارسال پاسخ وجود ندارد.

            </div>

        `;

        replyForm.style.display =
            "block";

    }

    else {

        replyForm.style.display =
            "block";


        replyForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const input =
                    document.getElementById(
                        "replyMessage"
                    );


                if (!input) {
                    return;
                }


                const message =
                    input.value.trim();


                if (
                    message.length < 2
                ) {

                    alert(
                        "متن پاسخ را وارد کنید."
                    );

                    return;

                }


                const allTickets =
                    JSON.parse(
                        localStorage.getItem(
                            "tickets"
                        ) || "[]"
                    );


                const index =
                    allTickets.findIndex(
                        function (item) {

                            return (

                                normalize(
                                    item.id ||
                                    item.ticketId ||
                                    item._id ||
                                    item.number
                                )

                                ===

                                normalize(
                                    ticketId
                                )

                            );

                        }
                    );


                if (index === -1) {

                    alert(
                        "تیکت پیدا نشد."
                    );

                    return;

                }


                const now =
                    new Date()
                        .toISOString();


                if (
                    !Array.isArray(
                        allTickets[index].messages
                    )
                ) {

                    allTickets[index].messages = [];

                }


                allTickets[index]
                    .messages
                    .push({

                        id:
                            Date.now(),

                        sender:
                            "user",

                        username:
                            user.username || "",

                        message:
                            message,

                        createdAt:
                            now

                    });


                allTickets[index]
                    .updatedAt =
                    now;


                allTickets[index]
                    .status =
                    "open";


                localStorage.setItem(
                    "tickets",
                    JSON.stringify(
                        allTickets
                    )
                );


                input.value = "";


                location.reload();

            }
        );

    }


})();

</script>


</body>

</html>
