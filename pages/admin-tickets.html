<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>مدیریت تیکت‌ها | آدینه سهند سازه</title>

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

</head>


<body class="profile-body">


<div class="profile-page">


    <div class="admin-page admin-tickets-page">


        <!-- HEADER -->

        <div class="admin-header">

            <div>

                <span class="admin-badge">
                    🎫 مدیریت پشتیبانی
                </span>

                <h1>
                    مدیریت تیکت‌ها
                </h1>

                <p>
                    مشاهده و مدیریت درخواست‌های کاربران
                </p>

            </div>


            <a
                href="admin.html"
                class="profile-btn"
            >
                ⬅️ پنل مدیریت
            </a>

        </div>



        <!-- FILTERS -->

        <div class="admin-ticket-tools">


            <input
                id="ticketSearch"
                type="text"
                placeholder="🔎 جستجوی عنوان، شماره، نام کاربری..."
            >


            <select id="ticketStatusFilter">

                <option value="all">
                    همه وضعیت‌ها
                </option>

                <option value="open">
                    باز
                </option>

                <option value="pending">
                    در حال بررسی
                </option>

                <option value="closed">
                    بسته
                </option>

            </select>


        </div>



        <!-- TICKETS -->

        <div id="adminTicketsList">

            <div class="ticket-loading">
                در حال بارگذاری تیکت‌ها...
            </div>

        </div>


    </div>


</div>



<script src="../assets/js/admin-tickets.js"></script>


</body>

</html>
