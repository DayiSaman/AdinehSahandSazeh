<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<title>ثبت نام</title>

<link rel="stylesheet" href="../assets/css/style.css">

</head>

<body>

<div class="auth-page">

<div class="auth-card">

<h1>ساخت حساب</h1>


<div class="auth-group">
<label>نام</label>

<input 
id="firstname"
type="text"
placeholder="نام فارسی"
oninput="onlyPersian(this)">
</div>



<div class="auth-group">
<label>نام خانوادگی</label>

<input 
id="lastname"
type="text"
placeholder="نام خانوادگی فارسی"
oninput="onlyPersian(this)">
</div>



<div class="auth-group">
<label>نام کاربری</label>

<input 
id="username"
type="text"
placeholder="username">
</div>



<div class="auth-group">
<label>شماره موبایل</label>

<input 
id="phone"
type="tel"
maxlength="11"
placeholder="09123456789">
</div>



<div class="auth-group">
<label>رمز عبور</label>

<input 
id="password"
type="password"
placeholder="رمز عبور">
</div>



<div class="auth-group">
<label>تکرار رمز عبور</label>

<input 
id="confirmPassword"
type="password"
placeholder="تکرار رمز عبور">
</div>



<button 
class="btn primary"
onclick="register()">

ثبت نام

</button>



<div class="auth-footer">

حساب دارید؟

<a href="login.html">
ورود
</a>

</div>


</div>

</div>



<script src="../assets/js/register.js"></script>

</body>

</html>
